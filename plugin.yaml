name: agenttrust-seal
label: AgentTrust Seal
kind: standalone
version: 0.2.0
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.22.2"
tags: [integrity, handoff, audit]
description: >
  Seal a file (sha256, bytes, author, UTC time) and verify the seal later, so
  one Hermes agent can prove to the next that a handoff was not changed.
  Offers the /agenttrust-seal slash command and a agenttrust_seal tool. Local only: no network,
  no credentials, no background work.
author: Syrup Labs
provides_tools:
  - agenttrust_seal
