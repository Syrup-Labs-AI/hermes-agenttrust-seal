name: agenttrust-seal
label: AgentTrust Seal
kind: standalone
version: 0.3.0
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.22.2"
tags: [integrity, handoff, audit]
description: >
  Seal a file (sha256, bytes, author, UTC time) and verify the seal later, so
  one Hermes agent can prove to the next that a handoff was not changed.
  Offers the /agenttrust-seal slash command and a agenttrust_seal tool. Seals can
  be signed with an SSH key you name, and an opt-in guard can refuse a read of a
  file whose seal is broken or forged. Local only: no network, no stored
  credentials, no background work.
author: Syrup Labs
provides_tools:
  - agenttrust_seal
provides_hooks:
  - pre_tool_call
